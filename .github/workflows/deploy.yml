name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Build (demo / mock mode)
        working-directory: frontend
        env:
          # 演示版固定使用内置演示数据；VITE_BASE 由仓库名推导，改名后无需改文件
          VITE_USE_MOCK: 'true'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Self check (base path injected)
        working-directory: frontend
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          grep -q "/${{ github.event.repository.name }}/" dist/index.html \
            || (echo "VITE_BASE not injected into dist/index.html" && exit 1)
          echo "build ok: $(du -sh dist | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
